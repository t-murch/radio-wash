services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: radiowash-api
    ports:
      - '5159:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # `.dockerignore` excludes appsettings.*.json so local secrets are never baked into an
      # image. The only config left inside the container is appsettings.json, which points at
      # production Supabase — so every local token fails signature validation and every browser
      # request is blocked by CORS. Inject the local values at runtime instead.
      #
      # Defaults below match a stock `supabase start`. Override any of them in .env (see
      # .env.example) — e.g. when running several Supabase projects on shifted ports.
      # Note the shifted *host* ports only matter to the browser (PublicUrl/JwtIssuer);
      # everything the container reaches goes over the Supabase network on internal ports.
      # Reached over Supabase's own Docker network by container name, so this is the
      # container's internal port (5432), never the shifted host port. Going through
      # host.docker.internal instead does not work: `host-gateway` resolves to the
      # DEFAULT bridge gateway, which is a different subnet from the network this
      # container runs on, so the address is simply unroutable from here.
      - ConnectionStrings__DefaultConnection=Host=${SUPABASE_DB_HOST:-supabase_db_RadioWash};Port=5432;Database=postgres;Username=postgres;Password=postgres
      # CORS admits exactly one origin (Program.cs: WithOrigins(frontendUrl)).
      - FrontendUrl=${FRONTEND_URL:-https://127.0.0.1:3000}
      # Supabase:Url is the container-to-container address used for JWKS; Supabase:PublicUrl is
      # the browser-facing address that GoTrue stamps as the JWT issuer. They differ under Docker.
      - Supabase__Url=http://${SUPABASE_KONG_HOST:-supabase_kong_RadioWash}:8000
      - Supabase__PublicUrl=http://127.0.0.1:${SUPABASE_API_PORT:-54321}
      - Supabase__JwtIssuer=http://127.0.0.1:${SUPABASE_API_PORT:-54321}/auth/v1
      - Supabase__JwtSecret=${SUPABASE_JWT_SECRET:-}
      - Supabase__AnonKey=${SUPABASE_ANON_KEY:-}
      - Supabase__ServiceRoleKey=${SUPABASE_SERVICE_ROLE_KEY:-}
      # Apple Music (optional locally — the API boots without it; Apple features 503 until set)
      - AppleMusic__TeamId=${APPLE_MUSIC_TEAM_ID:-}
      - AppleMusic__KeyId=${APPLE_MUSIC_KEY_ID:-}
      - AppleMusic__PrivateKeyBase64=${APPLE_MUSIC_PRIVATE_KEY_B64:-}
    networks:
      - supabase

networks:
  # Supabase's own network, created by `supabase start`. Joining it is what lets the
  # API resolve `supabase_db_RadioWash` and `supabase_kong_RadioWash` by name — the
  # Kong hostname above was already written that way and could never have resolved
  # from a separate network.
  #
  # The name is derived from the project_id in supabase/config.toml, so it changes if
  # that changes; override with SUPABASE_NETWORK in .env if needed.
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_network_RadioWash}
