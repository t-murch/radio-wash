version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: radiowash-api
    ports:
      - '5159:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=54322;Database=postgres;Username=postgres;Password=postgres
      # Apple Music (optional locally — the API boots without it; Apple features 503 until set)
      - AppleMusic__TeamId=${APPLE_MUSIC_TEAM_ID:-}
      - AppleMusic__KeyId=${APPLE_MUSIC_KEY_ID:-}
      - AppleMusic__PrivateKeyBase64=${APPLE_MUSIC_PRIVATE_KEY_B64:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - radiowash

networks:
  radiowash:
    external: true
